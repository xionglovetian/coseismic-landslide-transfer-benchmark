name: validate-reproducibility-package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate package structure and metric anchors
        run: python scripts/checks/validate_release.py
      - name: Verify package SHA-256 manifest
        run: python scripts/checks/verify_manifest.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts